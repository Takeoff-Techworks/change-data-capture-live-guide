{% extends "base.html" %}{% block content %}<h2>Doctor & PA view</h2>{% if persona.role in ['doctor','pa'] %}<form method="post" action="/clinician/referrals?persona={{persona.user_id}}"><select name="patient_id">{% for p in patients %}<option value="{{p.patient_id}}">{{p.display_name}}</option>{% endfor %}</select><input name="specialty" value="Community Support"><button>Create referral</button></form>{% endif %}<table><tr><th>Patient</th><th>Specialty</th><th>Status</th><th>Requested</th></tr>{% for r in referrals %}<tr><td>{{r.patient_id}}</td><td>{{r.receiving_specialty}}</td><td>{{r.status}}</td><td>{{r.requested_at}}</td></tr>{% endfor %}</table>{% endblock %}
