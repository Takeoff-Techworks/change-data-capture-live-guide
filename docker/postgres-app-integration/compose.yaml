name: northstar-postgres-seed-lab
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-lab-only
      POSTGRES_DB: northstar_cdc_lab
    ports:
      - "127.0.0.1:15432:5432"
      - "[::1]:15432:5432"
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10", "-c", "max_slot_wal_keep_size=1GB"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-northstar-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northstar_cdc_lab"]
      interval: 5s
      timeout: 5s
      retries: 30

  receiver:
    image: python:3.12-slim
    command: ["python", "-u", "/lab/debezium_http_receiver.py", "serve"]
    volumes:
      - ./receiver/debezium_http_receiver.py:/lab/debezium_http_receiver.py:ro
      - received-events:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8081/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 20

  debezium:
    image: quay.io/debezium/server:3.4
    profiles: ["capture"]
    depends_on:
      postgres:
        condition: service_healthy
      receiver:
        condition: service_healthy
    volumes:
      - ./config/postgres-debezium.properties:/debezium/config/application.properties:ro
      - debezium-offsets:/debezium/data

  debezium-app:
    image: quay.io/debezium/server:3.4
    profiles: ["app-capture"]
    depends_on:
      postgres:
        condition: service_healthy
      receiver:
        condition: service_healthy
    volumes:
      - ./config/postgres-debezium-app.properties:/debezium/config/application.properties:ro
      - app-offsets:/debezium/data

volumes:
  postgres-data:
  received-events:
  debezium-offsets:
  app-offsets:
